name: validate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The portability floor is python 3.9 (STANDARD §portability) — pin it so
      # CI fails on a 3.10+ construct instead of shipping it to users on 3.9.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      # On a version tag (v1.2.3), fail unless it matches plugin.json's version.
      # The renderer stamps that version into every generated page, so a drifting
      # tag mislabels the output people paste into review.
      - name: Check tag matches plugin version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./.claude-plugin/plugin.json').version")"
          echo "tag: $tag   plugin.json: $pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match plugin.json version $pkg — bump plugin.json or retag."
            exit 1
          fi
          echo "OK — tag matches plugin.json ($pkg)"

      # Belt-and-suspenders: a deterministic JSON gate that needs no auth, so a
      # broken manifest fails even if the CLI step has trouble.
      - name: Lint manifest (JSON syntax)
        run: node -e "JSON.parse(require('fs').readFileSync('.claude-plugin/plugin.json','utf8'))"

      - name: Shell + Python syntax
        run: |
          for f in scripts/*.sh templates/crew/crew; do bash -n "$f"; done
          python3 -m py_compile scripts/docs_render.py scripts/docs_detect.py scripts/hook_*.py

      # The scaffold must validate clean out of the box: the shipped -000 example
      # chain is self-consistent by design, and a fresh tree is the first thing
      # every new user sees.
      - name: Scaffold a fresh repo and validate it
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work"
          bash scripts/docs_validate.sh "$work/docs"

      # The folder set became a function of one declared field, and a function has
      # branches the byte-identical sample gate cannot see: the samples render one
      # fixture, which takes one path through it. Every branch is asserted here
      # instead — the exact folder list, a clean validate with no layout NOTE, and
      # no seed file leaking in from a folder the profile excluded.
      - name: Profile decides the folder set, and every branch is covered
        run: |
          CORE="00_roadmap 01_products 02_architecture 03_business-logic
                20_issues 21_proposals 22_decisions 23_backlog 30_conventions
                92_audit 93_qa 99_feedback"
          fails=0
          check() { # check <label> <owns> <expected folders>
            work="$(mktemp -d)"; git -C "$work" init -q
            if ! bash scripts/docs_scaffold.sh --owns "$2" "$work" > "$work/out.txt" 2>&1; then
              echo "::error::scaffold failed for profile '$1'"; cat "$work/out.txt"; fails=1; return
            fi
            got="$(cd "$work/docs" && ls -1 | grep -v '\.md$' | LC_ALL=C sort | tr '\n' ' ')"
            want="$(printf '%s\n' $3 | LC_ALL=C sort | tr '\n' ' ')"
            if [ "$got" != "$want" ]; then
              echo "::error::profile '$1' ($2) produced the wrong folder set"
              echo "  want: $want"
              echo "  got : $got"
              fails=1
            fi
            if ! bash scripts/docs_validate.sh "$work/docs" > "$work/val.txt" 2>&1; then
              echo "::error::profile '$1' does not validate clean"; cat "$work/val.txt"; fails=1
            fi
            if grep -q 'NOTE \[layout\]' "$work/val.txt"; then
              echo "::error::profile '$1' reports a missing folder it never asked for"
              grep 'NOTE \[layout\]' "$work/val.txt"; fails=1
            fi
            echo "  ok — $1: $(printf '%s' "$got" | wc -w | tr -d ' ') folders"
          }
          check "library (owns nothing conditional)" "" "$CORE"
          check "backend service" "data,endpoints,deploys" \
                "$CORE 04_api 40_services 50_runbooks 70_deploy"
          check "frontend app" "screens,deploys" \
                "$CORE 60_fe-integration 40_services 50_runbooks 70_deploy"
          check "fullstack" "data,endpoints,screens,jobs,deploys" \
                "$CORE 04_api 40_services 50_runbooks 60_fe-integration 70_deploy"
          # The union must be the whole template tree. A folder no profile can ever
          # produce is a folder shipped for nobody.
          shipped="$(cd templates/docs && ls -1 | grep -v '\.md$' | LC_ALL=C sort | tr '\n' ' ')"
          full="$(mktemp -d)"; git -C "$full" init -q
          bash scripts/docs_scaffold.sh --owns data,endpoints,screens,jobs,deploys "$full" >/dev/null
          union="$(cd "$full/docs" && ls -1 | grep -v '\.md$' | LC_ALL=C sort | tr '\n' ' ')"
          if [ "$shipped" != "$union" ]; then
            echo "::error::templates/docs ships a folder no profile can produce"
            echo "  shipped: $shipped"
            echo "  union  : $union"
            fails=1
          fi
          # A seed from an excluded folder must not arrive by the file loop either.
          lib="$(mktemp -d)"; git -C "$lib" init -q
          bash scripts/docs_scaffold.sh --owns '' "$lib" >/dev/null
          if [ -e "$lib/docs/04_api/example-api.md" ] || [ -e "$lib/docs/60_fe-integration/overview.md" ]; then
            echo "::error::a seed file leaked in from a folder the profile excluded"; fails=1
          fi
          [ "$fails" -eq 0 ] || exit 1
          echo "OK — every profile branch produces exactly its folder set"

      # The migration guarantee, and the only thing standing between this feature
      # and every repo scaffolded by an older docs-kit: without a declaration
      # nothing branches. `owns: []` is a different thing — it IS a declaration.
      - name: A repo that declares nothing still gets all 17
        run: |
          work="$(mktemp -d)"; git -C "$work" init -q
          printf '{\n  "sensitive_paths": ["**/schema/**"]\n}\n' > "$work/.docs-kit.json"
          bash scripts/docs_scaffold.sh "$work" > "$work/out.txt"
          n="$(cd "$work/docs" && ls -1 | grep -cv '\.md$')"
          [ "$n" -eq 17 ] || { echo "::error::a repo with no owns got $n folders, not 17"; exit 1; }
          grep -q 'no owns declared' "$work/out.txt" \
            || { echo "::error::scaffold did not say the profile was undeclared"; cat "$work/out.txt"; exit 1; }
          bash scripts/docs_validate.sh "$work/docs" > "$work/val.txt"
          if grep -q 'NOTE \[layout\]' "$work/val.txt"; then
            echo "::error::an undeclared repo reported a layout NOTE"; cat "$work/val.txt"; exit 1
          fi
          # And the other reading: an explicitly empty owns is a library, not silence.
          empty="$(mktemp -d)"; git -C "$empty" init -q
          printf '{\n  "owns": []\n}\n' > "$empty/.docs-kit.json"
          bash scripts/docs_scaffold.sh "$empty" >/dev/null
          m="$(cd "$empty/docs" && ls -1 | grep -cv '\.md$')"
          [ "$m" -eq 12 ] || { echo "::error::'owns: []' got $m folders, not 12 — it was read as silence"; exit 1; }
          echo "OK — no declaration means all 17; an empty declaration means core only"

      # `owns` is a closed enum and now decides folders, so a typo costs a folder
      # silently. Both ends have to refuse it: the scaffold before writing anything,
      # the validator on a repo where it already got in.
      - name: An unknown owns token is refused, not shrugged at
        run: |
          work="$(mktemp -d)"; git -C "$work" init -q
          if bash scripts/docs_scaffold.sh --owns endpoint "$work" > "$work/out.txt" 2>&1; then
            echo "::error::scaffold accepted the token 'endpoint'"; cat "$work/out.txt"; exit 1
          fi
          [ ! -e "$work/docs" ] || { echo "::error::scaffold wrote docs/ before rejecting the token"; exit 1; }
          grep -q "unknown owns token" "$work/out.txt" \
            || { echo "::error::scaffold rejected it without saying why"; cat "$work/out.txt"; exit 1; }
          bash scripts/docs_scaffold.sh --owns endpoints "$work" >/dev/null
          printf '{\n  "owns": ["endpoint"]\n}\n' > "$work/.docs-kit.json"
          if bash scripts/docs_validate.sh "$work/docs" > "$work/val.txt" 2>&1; then
            echo "::error::validator passed a repo whose owns holds a typo"; cat "$work/val.txt"; exit 1
          fi
          grep -q 'FAIL \[profile\]' "$work/val.txt" \
            || { echo "::error::wrong tag for an unknown owns token"; cat "$work/val.txt"; exit 1; }
          echo "OK — a typo in owns is caught at both ends"

      # A repo grows. Declaring a new token and re-syncing is the whole upgrade
      # path, and the direction that must NEVER work is the other one: removing a
      # token must not remove a folder, or a config edit deletes documentation.
      - name: --sync follows a growing profile and never shrinks one
        run: |
          work="$(mktemp -d)"; git -C "$work" init -q
          bash scripts/docs_scaffold.sh --owns '' "$work" >/dev/null
          [ ! -d "$work/docs/04_api" ] || { echo "::error::library got 04_api"; exit 1; }
          printf '{\n  "owns": ["endpoints"]\n}\n' > "$work/.docs-kit.json"
          bash scripts/docs_scaffold.sh --sync "$work" > "$work/sync.txt"
          [ -f "$work/docs/04_api/example-api.md" ] \
            || { echo "::error::sync did not add 04_api for a grown profile"; cat "$work/sync.txt"; exit 1; }
          bash scripts/docs_scaffold.sh --sync "$work" > "$work/again.txt"
          grep -q 'nothing to add' "$work/again.txt" \
            || { echo "::error::sync is not idempotent"; cat "$work/again.txt"; exit 1; }
          # Now shrink the declaration. Nothing may disappear.
          echo "mine" > "$work/docs/04_api/hand-written.md"
          printf '{\n  "owns": []\n}\n' > "$work/.docs-kit.json"
          bash scripts/docs_scaffold.sh --sync "$work" >/dev/null
          [ -f "$work/docs/04_api/hand-written.md" ] \
            || { echo "::error::sync deleted a document because owns shrank"; exit 1; }
          bash scripts/docs_validate.sh "$work/docs" > "$work/val.txt" || true
          if grep -q 'NOTE \[layout\]' "$work/val.txt"; then
            echo "::error::a folder outside the profile was reported as missing"; exit 1
          fi
          grep -q "NOTE \[profile\].*endpoints" "$work/val.txt" \
            || { echo "::error::a repo holding contracts while owns omits 'endpoints' went unreported"; cat "$work/val.txt"; exit 1; }
          echo "OK — sync grows with the profile, never shrinks the tree"

      # 99_feedback/ is the one folder that files itself: the script allocates the
      # id and stamps the context, so the two things a hand-written report gets
      # wrong are the two things nobody has to type. Assert both, plus the refusal
      # on a repo that predates the folder — that refusal is the whole upgrade hint.
      # 99_feedback/ is the one folder that files itself: the script allocates the
      # id and stamps the context, so the two things a hand-written report gets
      # wrong are the two things nobody has to type. Assert both, plus the refusal
      # on a repo that predates the folder — that refusal is the whole upgrade hint.
      #
      # Every check below reads a FILE, never a pipe into `grep -q`: this job runs
      # under `pipefail`, and a `grep -q` that matches early closes the pipe, kills
      # the producing script with SIGPIPE, and fails the step on a passing case.
      - name: docs_feedback.sh allocates ids, stamps context, and refuses a repo without the folder
        run: |
          work="$(mktemp -d)"; git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          [ -f "$work/docs/99_feedback/TEMPLATE.md" ] \
            || { echo "::error::scaffold produced no 99_feedback/TEMPLATE.md"; exit 1; }

          bash scripts/docs_feedback.sh new "Hook Stayed QUIET!!" "$work" > "$work/new1.txt"
          f1="$work/docs/99_feedback/FEEDBACK-001-hook-stayed-quiet.md"
          [ -f "$f1" ] || { echo "::error::slug was not normalised into a filename"; cat "$work/new1.txt"; exit 1; }
          ver="$(node -p "require('./.claude-plugin/plugin.json').version")"
          grep -q "kit_version: \"$ver\"" "$f1" \
            || { echo "::error::report does not carry the kit version $ver"; sed -n 1,20p "$f1"; exit 1; }
          ! grep -q '{{' "$f1" \
            || { echo "::error::a template placeholder survived substitution"; grep -n '{{' "$f1"; exit 1; }

          # The second report takes the next id, read from `id:` and not from the filename.
          bash scripts/docs_feedback.sh new second-thing "$work" >/dev/null
          grep -q '^id: FEEDBACK-002' "$work/docs/99_feedback/FEEDBACK-002-second-thing.md" \
            || { echo "::error::the second report did not get FEEDBACK-002"; exit 1; }

          bash scripts/docs_feedback.sh show 002 "$work" > "$work/shown.txt"
          grep -q '^id: FEEDBACK-002' "$work/shown.txt" \
            || { echo "::error::show did not print the report it was asked for"; exit 1; }
          bash scripts/docs_feedback.sh list "$work" > "$work/list1.txt"
          [ "$(grep -c '^FEEDBACK-' "$work/list1.txt")" -eq 2 ] \
            || { echo "::error::list did not report both files"; cat "$work/list1.txt"; exit 1; }

          # A zero-padded id is not octal. `printf '%03d' 077` reads it as 63 and
          # hunts for a report nobody filed — found by testing, kept as a gate.
          sed -e 's/^id: FEEDBACK-NNN/id: FEEDBACK-077/' \
              -e 's/^# <.*/# a real title in the body/' \
              "$work/docs/99_feedback/TEMPLATE.md" > "$work/docs/99_feedback/FEEDBACK-077-octal.md"
          bash scripts/docs_feedback.sh show 077 "$work" > "$work/shown77.txt"
          grep -q '^id: FEEDBACK-077' "$work/shown77.txt" \
            || { echo "::error::show read a zero-padded id as octal"; exit 1; }
          bash scripts/docs_feedback.sh new after-octal "$work" >/dev/null
          [ -f "$work/docs/99_feedback/FEEDBACK-078-after-octal.md" ] \
            || { echo "::error::the next id after 077 was not 078"; exit 1; }

          # The title column reads the BODY heading. The frontmatter carries `#`
          # comment lines of its own, and one of them read as every report's title.
          bash scripts/docs_feedback.sh list "$work" > "$work/list2.txt"
          grep -q 'a real title in the body' "$work/list2.txt" \
            || { echo "::error::list did not take the title from the body heading"; cat "$work/list2.txt"; exit 1; }
          grep '^FEEDBACK-' "$work/list2.txt" > "$work/rows.txt"
          ! grep -q 'Bên dưới do' "$work/rows.txt" \
            || { echo "::error::list took a frontmatter comment as a title"; cat "$work/rows.txt"; exit 1; }

          # Reports are markdown under docs/ — they must not cost the repo a FAIL.
          bash scripts/docs_validate.sh "$work/docs" \
            || { echo "::error::filed reports broke the validator"; exit 1; }

          # A repo scaffolded before 0.27.0 gets exit 3 and the upgrade path, never
          # a silently created folder.
          old="$(mktemp -d)"; git -C "$old" init -q
          bash scripts/docs_scaffold.sh "$old" >/dev/null
          rm -rf "$old/docs/99_feedback"
          if bash scripts/docs_feedback.sh new anything "$old" > "$old/out.txt" 2>&1; then
            echo "::error::the script wrote a report into a repo with no 99_feedback/"; exit 1
          fi
          grep -q 'docs-upgrade' "$old/out.txt" \
            || { echo "::error::the refusal did not name the upgrade path"; cat "$old/out.txt"; exit 1; }
          [ ! -d "$old/docs/99_feedback" ] \
            || { echo "::error::the refusal created the folder anyway"; exit 1; }
          echo "OK — reports file themselves, and a pre-0.27.0 repo is told how to catch up"

      # The read model has to follow the profile too, or the saving is undone by a
      # page nagging about a section the repo deliberately does not have. Section
      # numbers are assigned in render order for this reason, so an omitted section
      # closes the gap instead of leaving a hole.
      - name: current.html omits a section the repo does not have, and renumbers
        run: |
          work="$(mktemp -d)"; git -C "$work" init -q
          bash scripts/docs_scaffold.sh --owns '' "$work" >/dev/null
          python3 scripts/docs_render.py "$work" >/dev/null
          cur="$work/docs/current.html"
          if grep -q 'id="api"' "$cur"; then
            echo "::error::API section rendered for a repo with no 04_api/"; exit 1
          fi
          grep -q '§4</span>Business flows' "$cur" \
            || { echo "::error::sections did not renumber after the omission"; exit 1; }
          if grep -q 'href="04_api/"\|href="60_fe-integration/"' "$work/docs/index.html"; then
            echo "::error::index.html links a folder this profile has no directory for"; exit 1
          fi
          # And with the folder present, the section is back and numbered §4.
          full="$(mktemp -d)"; git -C "$full" init -q
          bash scripts/docs_scaffold.sh --owns endpoints "$full" >/dev/null
          python3 scripts/docs_render.py "$full" >/dev/null
          grep -q '§4</span>API contracts' "$full/docs/current.html" \
            || { echo "::error::API section missing or misnumbered when 04_api/ exists"; exit 1; }
          echo "OK — the read model follows the profile"

      # docs-init reads this report to fill tech_stack, so it has to state facts
      # the manifest really declares — and stay quiet, not guess, when there is
      # no manifest at all.
      - name: Detector reports a real stack, and nothing on an empty tree
        run: |
          work="$(mktemp -d)"
          printf 'module example.com/x\n\ngo 1.22\n\nrequire (\n\tgithub.com/jackc/pgx/v5 v5.5.0\n\tgithub.com/x/y v1.0.0 // indirect\n)\n' > "$work/go.mod"
          printf 'services:\n  postgres:\n    image: postgres:16\n' > "$work/docker-compose.yml"
          out="$(python3 scripts/docs_detect.py "$work")"
          echo "$out"
          echo "$out" | grep -qx 'lang: go 1.22' || { echo "::error::detector missed the declared go version."; exit 1; }
          echo "$out" | grep -qx 'service: postgres image postgres:16' || { echo "::error::detector missed the compose image."; exit 1; }
          echo "$out" | grep -qx 'dep: github.com/x/y' && { echo "::error::detector reported an indirect dependency as direct."; exit 1; }
          echo "$out" | tail -1 | grep -qx 'DETECT OK' || { echo "::error::detector did not finish with DETECT OK."; exit 1; }
          empty="$(mktemp -d)"
          [ "$(python3 scripts/docs_detect.py "$empty")" = "DETECT OK" ] \
            || { echo "::error::detector invented facts about an empty tree."; exit 1; }
          echo "OK — detector states what is declared and nothing else"

      # A hint decides how many folders docs-init scaffolds, so it has to carry the
      # evidence a user can check — and it must stay a hint: the detector writes
      # nothing, ever.
      - name: Detector proposes a profile with evidence, and declares nothing
        run: |
          work="$(mktemp -d)"
          printf 'module example.com/x\n\ngo 1.22\n\nrequire (\n\tgithub.com/gin-gonic/gin v1.9.1\n\tgithub.com/jackc/pgx/v5 v5.5.0\n)\n' > "$work/go.mod"
          printf 'services:\n  postgres:\n    image: postgres:16\n  broker:\n    image: rabbitmq:3\n' > "$work/docker-compose.yml"
          printf 'FROM scratch\n' > "$work/Dockerfile"
          mkdir -p "$work/web" && printf '{"dependencies":{"next":"14"}}\n' > "$work/web/package.json"
          out="$(python3 scripts/docs_detect.py "$work")"
          echo "$out"
          for want in 'owns-hint: endpoints — go.mod declares github.com/gin-gonic/gin' \
                      'owns-hint: data — go.mod declares github.com/jackc/pgx/v5' \
                      'owns-hint: jobs — docker-compose runs rabbitmq:3' \
                      'owns-hint: screens — web/package.json declares next' \
                      'owns-hint: deploys — Dockerfile present' \
                      'module-count: 2'; do
            echo "$out" | grep -qxF "$want" \
              || { echo "::error::detector missed: $want"; exit 1; }
          done
          # Every hint names its evidence on the same line, or a user is being asked
          # to confirm something they cannot check.
          echo "$out" | grep '^owns-hint:' | while IFS= read -r line; do
            case "$line" in *" — "*) ;; *) echo "::error::hint without evidence: $line"; exit 1 ;; esac
          done
          # Read-only means read-only: no config appears, no docs/ appears.
          [ ! -e "$work/.docs-kit.json" ] || { echo "::error::detector wrote .docs-kit.json"; exit 1; }
          [ ! -e "$work/docs" ] || { echo "::error::detector created docs/"; exit 1; }
          echo "OK — the detector proposes with evidence and writes nothing"

      # A mutation the validator is supposed to catch must actually fail it —
      # otherwise the check above only proves the script exits 0.
      - name: Validator catches a dangling ref
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          sed -i 's/^issue_ref: ISSUE-000/issue_ref: ISSUE-999/' \
            "$work/docs/21_proposals/PROPOSAL-000-example.md"
          if bash scripts/docs_validate.sh "$work/docs"; then
            echo "::error::validator passed a dangling issue_ref — the ref check is broken."
            exit 1
          fi
          echo "OK — dangling ref rejected"

      # [anchor] is the check that makes "synchronised to a specific version"
      # possible, so both of its halves need proving: it must fail on a path that
      # moved, and it must stay silent on the template's <placeholder> values —
      # otherwise every fresh scaffold is red and users switch it off.
      - name: Validator catches a moved path, ignores placeholders
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" config user.email ci@example.invalid
          git -C "$work" config user.name ci
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          mkdir -p "$work/src/engine" && echo 'package main' > "$work/src/engine/match.go"
          python3 - "$work" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1]) / "docs/02_architecture/architecture.md"
          p.write_text(p.read_text().replace(
              "components: []",
              "components:\n  - engine `src/engine/match.go` — khớp lệnh"))
          PY
          bash scripts/docs_validate.sh "$work/docs" \
            || { echo "::error::anchor check failed on a path that exists."; exit 1; }
          mv "$work/src/engine/match.go" "$work/src/engine/matcher.go"
          if bash scripts/docs_validate.sh "$work/docs"; then
            echo "::error::validator passed a components path that no longer exists."
            exit 1
          fi
          echo "OK — moved path rejected, placeholders ignored"

      # Archiving must lower read cost without lowering the standard: a document
      # under _archive/ has to keep being validated, or "archive it" becomes a way
      # to launder a broken one.
      - name: Archived documents are still validated
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          mkdir -p "$work/docs/23_backlog/_archive"
          mv "$work/docs/23_backlog/BACKLOG-000-example.md" "$work/docs/23_backlog/_archive/"
          bash scripts/docs_validate.sh "$work/docs" \
            || { echo "::error::archiving a valid document made the tree invalid."; exit 1; }
          sed -i 's/^source_ref: DECISION-000/source_ref: DECISION-888/' \
            "$work/docs/23_backlog/_archive/BACKLOG-000-example.md"
          if bash scripts/docs_validate.sh "$work/docs"; then
            echo "::error::a dangling ref inside _archive/ was not reported."
            exit 1
          fi
          echo "OK — _archive/ is read less, validated the same"

      # INDEX.md is what skills read INSTEAD of globbing a folder, so a stale one
      # is worse than none: the next agent trusts it. Rendering twice must produce
      # the same bytes, and every id in the tree must appear in it.
      - name: INDEX.md is generated, complete, and deterministic
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          DOCS_KIT_NOW=2026-01-01T00:00:00 python3 scripts/docs_render.py "$work" >/dev/null
          cp "$work/docs/INDEX.md" "$work/first.md"
          DOCS_KIT_NOW=2026-01-01T00:00:00 python3 scripts/docs_render.py "$work" >/dev/null
          diff -q "$work/first.md" "$work/docs/INDEX.md" \
            || { echo "::error::INDEX.md is not deterministic."; exit 1; }
          for id in ISSUE-000 PROPOSAL-000 DECISION-000 BACKLOG-000; do
            grep -q "$id" "$work/docs/INDEX.md" \
              || { echo "::error::INDEX.md omits $id — skills reading it would miss the doc."; exit 1; }
          done
          echo "OK — INDEX.md complete and byte-stable"

      # The index is only safe to trust if something notices when it goes stale.
      # --check must catch a document added without re-rendering, and must write
      # nothing while doing it.
      - name: --check catches a stale INDEX.md and writes nothing
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          bash scripts/docs_render.sh --check "$work" \
            && { echo "::error::--check passed with no INDEX.md at all."; exit 1; }
          bash scripts/docs_render.sh "$work" >/dev/null
          bash scripts/docs_render.sh --check "$work" \
            || { echo "::error::--check called a freshly rendered index stale."; exit 1; }
          before="$(cd "$work/docs" && cksum INDEX.md MAP.tsv *.html | cksum)"
          printf -- '---\nid: ISSUE-001\ndescription: "x"\nwhy: "y"\nlane: fast\nstatus: open\n---\n\n# ISSUE-001\n' \
            > "$work/docs/20_issues/ISSUE-001-x.md"
          if bash scripts/docs_render.sh --check "$work"; then
            echo "::error::--check missed a document added without re-rendering."
            exit 1
          fi
          after="$(cd "$work/docs" && cksum INDEX.md MAP.tsv *.html | cksum)"
          [ "$before" = "$after" ] \
            || { echo "::error::--check modified files; it must be read-only."; exit 1; }
          echo "OK — stale index caught, nothing written"

      # MAP.tsv is what the Stop hook reads to decide whether an edited file is
      # described by any document. A stale one does not produce a wrong warning —
      # it produces a MISSING one, so this asserts the relation is actually built
      # (including both authored forms: a comma list and a glob) and that --check
      # notices when it falls behind.
      - name: MAP.tsv maps code to the documents that claim it
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          mkdir -p "$work/lib"
          : > "$work/lib/pricing.ts"; : > "$work/lib/a.schema.ts"
          python3 - "$work" <<'EOF'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "docs/02_architecture/architecture.md"
          s = p.read_text()
          s = re.sub(r"^components:.*?(?=\n[a-z_]+:)",
                     "components:\n  - pricing `lib/pricing.ts` — x\n"
                     "  - schemas `lib/*.schema.ts` — y\n", s, flags=re.S | re.M)
          p.write_text(s)
          EOF
          python3 scripts/docs_render.py "$work" >/dev/null
          grep -q '^lib/pricing\.ts	02_architecture/architecture\.md	component:pricing' \
            "$work/docs/MAP.tsv" \
            || { echo "::error::MAP.tsv lost a plain component path."; exit 1; }
          grep -q '^lib/\*\.schema\.ts	02_architecture/architecture\.md	component:schemas' \
            "$work/docs/MAP.tsv" \
            || { echo "::error::MAP.tsv lost a glob anchor."; exit 1; }
          bash scripts/docs_render.sh --check "$work" \
            || { echo "::error::--check called a freshly rendered MAP.tsv stale."; exit 1; }
          printf 'lib/extra.ts\n' >> "$work/docs/MAP.tsv"
          bash scripts/docs_render.sh --check "$work" \
            && { echo "::error::--check missed a hand-edited MAP.tsv."; exit 1; }
          echo "OK — MAP.tsv built from both anchor forms and gated"

      # The anchor check reports a path that is gone. It must NOT report a path
      # that is merely punctuated as a list, or written as a glob, or named with a
      # Next.js [id] segment — three forms a real repo produced within an hour, all
      # of which used to FAIL and made the check untrustworthy.
      - name: anchors accept lists, globs and bracket segments
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          mkdir -p "$work/app/users/[id]" "$work/lib"
          : > "$work/app/users/[id]/page.tsx"; : > "$work/lib/a.schema.ts"
          : > "$work/lib/comment.ts"
          python3 - "$work" <<'EOF'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "docs/02_architecture/architecture.md"
          s = p.read_text()
          s = re.sub(r"^components:.*?(?=\n[a-z_]+:)",
                     "components:\n  - ui `app/users/[id]/page.tsx` — x\n"
                     "  - schemas `lib/*.schema.ts` — y\n"
                     "  - gone `lib/deleted.ts` — z\n", s, flags=re.S | re.M)
          s += ("\n```flow\ntitle: t\ncode: app/users/[id]/page.tsx, lib/comment.ts\n"
                "a -> b : x\n```\n")
          p.write_text(s)
          EOF
          out="$(bash scripts/docs_validate.sh "$work/docs" 2>&1 || true)"
          echo "$out" | grep -q "lib/deleted.ts" \
            || { echo "::error::a genuinely missing anchor stopped being reported."; exit 1; }
          for good in "app/users/\[id\]/page.tsx" "lib/\*.schema.ts" "lib/comment.ts"; do
            echo "$out" | grep -q "FAIL \[anchor\].*$good" \
              && { echo "::error::anchor check false-positived on $good"; exit 1; }
          done
          [ "$(echo "$out" | grep -c 'FAIL \[anchor\]')" = "1" ] \
            || { echo "::error::expected exactly one anchor failure."; exit 1; }
          echo "OK — one real miss reported, three legal forms accepted"

      # docs_close.sh turns a `Closes:` trailer into the two writes that used to be
      # inferred from a session's own recollection. The properties that make it safe
      # to run over the whole history every time are idempotence and refusing to
      # invent: both are asserted here, not assumed.
      - name: Closes trailers record completions, idempotently
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" config user.email ci@example.com
          git -C "$work" config user.name ci
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          sed -e 's/^id: BACKLOG-000/id: BACKLOG-001/' -e 's/^status: .*/status: open/' \
            "$work/docs/23_backlog/BACKLOG-000-example.md" \
            > "$work/docs/23_backlog/BACKLOG-001-x.md"
          git -C "$work" add -A && git -C "$work" commit -qm scaffold
          : > "$work/feature.ts"
          git -C "$work" add -A
          git -C "$work" commit -qm "add the thing" -m "Closes: BACKLOG-001"
          bash scripts/docs_close.sh "$work" && \
            { echo "::error::report mode did not signal pending work."; exit 1; }
          bash scripts/docs_close.sh --apply "$work" >/dev/null \
            || { echo "::error::--apply failed."; exit 1; }
          grep -q '^status: done' "$work/docs/23_backlog/BACKLOG-001-x.md" \
            || { echo "::error::status was not flipped."; exit 1; }
          grep -q 'BACKLOG-001 (DECISION-000).*commit' "$work/docs/92_audit/LOG.md" \
            || { echo "::error::audit line missing or does not cite the commit."; exit 1; }
          lines_before="$(wc -l < "$work/docs/92_audit/LOG.md")"
          bash scripts/docs_close.sh --apply "$work" >/dev/null
          lines_after="$(wc -l < "$work/docs/92_audit/LOG.md")"
          [ "$lines_before" = "$lines_after" ] \
            || { echo "::error::re-running appended a duplicate audit line."; exit 1; }
          git -C "$work" commit -q --allow-empty -m "later" -m "Closes: BACKLOG-777"
          bash scripts/docs_close.sh "$work" | grep -q 'SKIP  BACKLOG-777' \
            || { echo "::error::a trailer with no Backlog item must be reported, not invented."; exit 1; }
          [ -z "$(ls "$work/docs/23_backlog"/BACKLOG-777* 2>/dev/null)" ] \
            || { echo "::error::docs_close created a document."; exit 1; }
          bash scripts/docs_validate.sh "$work/docs" >/dev/null \
            || { echo "::error::the tree docs_close wrote does not validate."; exit 1; }
          echo "OK — trailer recorded once, nothing invented, tree still valid"

      # The Stop hook's whole job changed in 0.25.0: it asks MAP.tsv which document
      # claims an edited file instead of matching path-shape globs. The two cases
      # that made the old one unusable are asserted first — a repo that only has a
      # docs/README.md, and a file under a directory merely named `api`.
      - name: Stop hook reports by document, not by path shape
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          git -C "$work" config user.email ci@example.com
          git -C "$work" config user.name ci
          mkdir -p "$work/apps/api/src" "$work/lib"
          : > "$work/apps/api/src/thing.test.ts"; : > "$work/lib/pricing.ts"
          printf '%s\n' '{"type":"tool_use","name":"Edit","input":{"file_path":"apps/api/src/thing.test.ts"}}' > "$work/t.jsonl"
          # 1. Not a docs-kit repo: a bare docs/README.md is not a declaration.
          mkdir -p "$work/docs"; : > "$work/docs/README.md"
          out=$(printf '{"cwd":"%s","transcript_path":"%s"}' "$work" "$work/t.jsonl" \
                | python3 scripts/hook_stop_scan.py | wc -c)
          [ "$out" -eq 0 ] \
            || { echo "::error::hook fired in a repo that never declared docs-kit."; exit 1; }
          rm -rf "$work/docs"
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          python3 - "$work" <<'EOF'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1]) / "docs/02_architecture/architecture.md"
          s = p.read_text()
          p.write_text(re.sub(r"^components:.*?(?=\n[a-z_]+:)",
                              "components:\n  - pricing `lib/pricing.ts` — x\n",
                              s, flags=re.S | re.M))
          EOF
          python3 scripts/docs_render.py "$work" >/dev/null
          # 2. A file under apps/api/ that no document claims: silent. This is the
          #    exact edit the old glob reported in 15 of 36 real sessions.
          out=$(printf '{"cwd":"%s","transcript_path":"%s"}' "$work" "$work/t.jsonl" \
                | python3 scripts/hook_stop_scan.py | wc -c)
          [ "$out" -eq 0 ] \
            || { echo "::error::hook fired on an unclaimed file under a directory named api."; exit 1; }
          # 3. A file a document does claim: reported, naming the document.
          printf '%s\n' '{"type":"tool_use","name":"Edit","input":{"file_path":"lib/pricing.ts"}}' > "$work/t2.jsonl"
          msg=$(printf '{"cwd":"%s","transcript_path":"%s"}' "$work" "$work/t2.jsonl" \
                | python3 scripts/hook_stop_scan.py)
          echo "$msg" | grep -q '02_architecture/architecture.md' \
            || { echo "::error::hook did not name the document claiming the edited file."; exit 1; }
          # 4. Same edit, but the session also updated that document: silent.
          printf '%s\n%s\n' \
            '{"type":"tool_use","name":"Edit","input":{"file_path":"lib/pricing.ts"}}' \
            '{"type":"tool_use","name":"Edit","input":{"file_path":"docs/02_architecture/architecture.md"}}' \
            > "$work/t3.jsonl"
          out=$(printf '{"cwd":"%s","transcript_path":"%s"}' "$work" "$work/t3.jsonl" \
                | python3 scripts/hook_stop_scan.py | wc -c)
          [ "$out" -eq 0 ] \
            || { echo "::error::hook reported a document the session had already updated."; exit 1; }
          echo "OK — silent without a declaration, silent on unclaimed code, precise on claimed code"

      # 02_architecture/ is a folder. The renderer used to read architecture.md and
      # nothing else, so a per-service split was silently dropped from the sheet
      # while the validator called the tree clean. Both halves are asserted: every
      # document reaches the page, and a component name declared twice is rejected
      # because data_flow resolves components by name.
      - name: Architecture splits per service without losing a document
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          mkdir -p "$work/internal/orders" "$work/internal/billing"
          echo x > "$work/internal/orders/svc.go"
          echo x > "$work/internal/billing/svc.go"
          rm "$work/docs/02_architecture/architecture.md"
          for s in orders billing; do
            printf -- '---\ncomponents:\n  - %s `internal/%s/svc.go` — %s service\ndata_flow:\n  - %s -> other : x\ntech_stack: [go]\nconstraints: []\namended_by: []\n---\n\n# %s\n' \
              "$s" "$s" "$s" "$s" "$s" > "$work/docs/02_architecture/$s.md"
          done
          bash scripts/docs_validate.sh "$work/docs" \
            || { echo "::error::a per-service architecture split failed validation."; exit 1; }
          DOCS_KIT_NOW=2026-01-01T00:00:00 python3 scripts/docs_render.py "$work" >/dev/null
          for s in orders billing; do
            grep -q "class=\"nm\">$s<" "$work/docs/current.html" \
              || { echo "::error::$s.md was dropped from current.html."; exit 1; }
            grep -q "<code>$s.md</code>" "$work/docs/current.html" \
              || { echo "::error::the card for $s does not name the doc that declares it."; exit 1; }
          done
          sed -i 's/^  - billing /  - orders /' "$work/docs/02_architecture/billing.md"
          if bash scripts/docs_validate.sh "$work/docs"; then
            echo "::error::a component name declared in two architecture docs was accepted."
            exit 1
          fi
          echo "OK — every architecture doc renders, duplicate component names rejected"

      # 04_api exists because STANDARD 6 demanded a Decision before an API contract
      # changes while 4 said layer 3 needs none. Closing that means the folder has
      # to be held to layer 1's rules: the service join must resolve, the protocol
      # enum must bite, and the operations must reach the page.
      - name: API contracts are layer 1, and the service join resolves
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          test -f "$work/docs/04_api/example-api.md" \
            || { echo "::error::the scaffold does not ship 04_api/."; exit 1; }
          mkdir -p "$work/internal/orders" && echo x > "$work/internal/orders/svc.go"
          python3 - "$work" <<'PY'
          import pathlib, sys
          root = pathlib.Path(sys.argv[1])
          a = root / "docs/02_architecture/architecture.md"
          a.write_text(a.read_text().replace(
              "components: []",
              "components:\n  - orders `internal/orders/svc.go` — sở hữu đơn hàng"))
          q = root / "docs/04_api/example-api.md"
          q.write_text(q.read_text().replace('service: ""', 'service: "orders"'))
          PY
          bash scripts/docs_validate.sh "$work/docs" \
            || { echo "::error::a valid API contract failed validation."; exit 1; }
          DOCS_KIT_NOW=2026-01-01T00:00:00 python3 scripts/docs_render.py "$work" >/dev/null
          grep -q '§4</span>API contracts' "$work/docs/current.html" \
            || { echo "::error::the API section is missing from current.html."; exit 1; }
          grep -q '/orders/{id}' "$work/docs/current.html" \
            || { echo "::error::the api fence did not reach the page."; exit 1; }
          grep -q '^# file | service | protocol | ops' "$work/docs/INDEX.md" \
            || { echo "::error::INDEX.md has no 04_api section."; exit 1; }
          sed -i 's/^service: "orders"/service: "ordrs"/' "$work/docs/04_api/example-api.md"
          if bash scripts/docs_validate.sh "$work/docs"; then
            echo "::error::service: naming no component was accepted."
            exit 1
          fi
          sed -i 's/^service: "ordrs"/service: "orders"/; s/^protocol: http/protocol: soap/' \
            "$work/docs/04_api/example-api.md"
          if bash scripts/docs_validate.sh "$work/docs"; then
            echo "::error::an invalid protocol enum was accepted."
            exit 1
          fi
          echo "OK — 04_api validated, joined and rendered"

      # generated_from is the enforcement STANDARD 6 always asked for: it demands a
      # Decision before an API contract changes, and until now nothing could tell
      # that the change had happened. Both directions of drift must be caught, the
      # path-parameter normalisation must hold, and a YAML spec must be refused with
      # a message rather than guessed at.
      - name: check-api catches drift in both directions
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          mkdir -p "$work/internal/orders" && echo x > "$work/internal/orders/svc.go"
          printf '{"openapi":"3.0.0","paths":{"/v1/orders/{id}":{"get":{}},"/v1/internal/debug":{"get":{}}}}' \
            > "$work/openapi.json"
          python3 - "$work" <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          a = root / "docs/02_architecture/architecture.md"
          a.write_text(a.read_text().replace(
              "components: []",
              "components:\n  - orders `internal/orders/svc.go` — sở hữu đơn hàng"))
          q = root / "docs/04_api/example-api.md"
          t = q.read_text()
          t = (t.replace('service: ""', 'service: "orders"')
                .replace('base: ""', 'base: "/v1"')
                .replace('generated_from: ""', 'generated_from: "openapi.json"'))
          # `:id` here, `{id}` in the spec — normalisation must treat them as one.
          t = re.sub(r"(?m)^(GET|POST|DELETE|event) .*\n", "", t)
          t = t.replace("code: <thư mục chứa router/handler>",
                        "code: <thư mục chứa router/handler>\n"
                        "GET /orders/:id -> Order — đọc một đơn\n"
                        "PATCH /orders/{id} -> Order — không tồn tại thật")
          q.write_text(t)
          PY
          out="$(bash scripts/docs_render.sh --check-api "$work" 2>&1)" && {
            echo "::error::check-api passed a contract with drift in both directions."
            exit 1
          }
          echo "$out"
          echo "$out" | grep -q "GET /internal/debug' is live but undocumented" \
            || { echo "::error::an undocumented live operation was not reported."; exit 1; }
          echo "$out" | grep -q "PATCH /orders/{}' is documented but absent" \
            || { echo "::error::an operation documented but absent was not reported."; exit 1; }
          echo "$out" | grep -q "GET /orders" && {
            echo "::error::':id' vs '{id}' were treated as different operations."; exit 1; }
          # Fix both sides; the check must go quiet.
          printf '{"openapi":"3.0.0","paths":{"/v1/orders/{id}":{"get":{}}}}' > "$work/openapi.json"
          sed -i '/^PATCH \/orders/d' "$work/docs/04_api/example-api.md"
          bash scripts/docs_render.sh --check-api "$work" \
            || { echo "::error::check-api reported drift on a matching contract."; exit 1; }
          # Next.js and SvelteKit name route folders [id], and copying the route path
          # into the contract is the obvious thing to do. A real Next repo produced
          # four findings from that cosmetic difference alone. Asserted here, where
          # both sides already agree, so any output at all means the spellings did
          # not unify.
          sed -i 's|^GET /orders/:id|GET /orders/[id]|' "$work/docs/04_api/example-api.md"
          out="$(bash scripts/docs_render.sh --check-api "$work" 2>&1 || true)"
          case "$out" in *"/orders"*)
            echo "::error::'[id]' was not normalised like '{id}' and ':id'."; exit 1 ;; esac
          # YAML must be refused with a reason, never parsed by guesswork.
          cp "$work/openapi.json" "$work/openapi.yaml"
          sed -i 's|generated_from: "openapi.json"|generated_from: "openapi.yaml"|' \
            "$work/docs/04_api/example-api.md"
          bash scripts/docs_render.sh --check-api "$work" 2>&1 | grep -q "YAML" \
            || { echo "::error::a YAML spec was not refused with an explanation."; exit 1; }
          # A moved artifact is an anchor problem, and [anchor] must own it.
          sed -i 's|generated_from: "openapi.yaml"|generated_from: "api/gone.json"|' \
            "$work/docs/04_api/example-api.md"
          bash scripts/docs_validate.sh "$work/docs" 2>&1 | grep -q "FAIL \[anchor\].*api/gone.json" \
            || { echo "::error::a missing generated_from artifact was not caught by [anchor]."; exit 1; }
          echo "OK — drift caught both ways, paths normalised, YAML refused"

      # --sync is how a repo scaffolded by an older docs-kit picks up a folder a
      # later version added. It must add what is missing and, far more important,
      # never touch a byte of what is already there.
      - name: --sync adds what is missing and overwrites nothing
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          rm -rf "$work/docs/04_api"
          echo "MY OWN CONTENT" > "$work/docs/00_roadmap/roadmap.md"
          before="$(cd "$work/docs" && find . -type f | LC_ALL=C sort | xargs cksum | cksum)"
          bash scripts/docs_scaffold.sh --sync "$work" | tee /tmp/sync.out
          grep -q "added docs/04_api/example-api.md" /tmp/sync.out \
            || { echo "::error::--sync did not restore the missing folder."; exit 1; }
          [ "$(cat "$work/docs/00_roadmap/roadmap.md")" = "MY OWN CONTENT" ] \
            || { echo "::error::--sync overwrote existing content."; exit 1; }
          bash scripts/docs_scaffold.sh --sync "$work" | grep -q "nothing to add" \
            || { echo "::error::--sync is not idempotent."; exit 1; }
          # A seed arrives with its folder, never alone. Deleting a seed once the
          # real document is written is the documented thing to do, and sync must
          # not resurrect it — found by running this on a real repo.
          rm "$work/docs/04_api/example-api.md"
          bash scripts/docs_scaffold.sh --sync "$work" >/dev/null
          [ ! -e "$work/docs/04_api/example-api.md" ] \
            || { echo "::error::--sync resurrected a deliberately deleted seed."; exit 1; }
          bash scripts/docs_validate.sh "$work/docs" \
            || { echo "::error::a synced tree does not validate."; exit 1; }
          empty="$(mktemp -d)"
          bash scripts/docs_scaffold.sh --sync "$empty" && {
            echo "::error::--sync did not refuse a repo with no docs/."; exit 1; }
          echo "OK — sync adds only, is idempotent, and refuses an unscaffolded repo"

      # `owns` answers "when does the profile get updated": something deterministic
      # notices when the repo grew a surface nobody declared. It must stay quiet on
      # a fresh scaffold, whose example files are seeds rather than content.
      - name: NOTE [profile] fires on real content, never on a seed
        run: |
          work="$(mktemp -d)"
          git -C "$work" init -q
          bash scripts/docs_scaffold.sh "$work" >/dev/null
          # Captured rather than piped into grep -q: closing the pipe early makes the
          # validator's own echo fail with EPIPE and litters the log with a red
          # herring on every passing run.
          out="$(bash scripts/docs_validate.sh "$work/docs" || true)"
          case "$out" in *"NOTE [profile]"*)
            echo "::error::profile note fired with no owns declared."; exit 1 ;; esac
          echo '{"owns":["data"]}' > "$work/.docs-kit.json"
          out="$(bash scripts/docs_validate.sh "$work/docs" || true)"
          case "$out" in *"NOTE [profile]"*)
            echo "::error::profile note fired on untouched template seeds."; exit 1 ;; esac
          printf -- '---\nservice: ""\nprotocol: http\namended_by: []\n---\n\n# Orders API\n' \
            > "$work/docs/04_api/orders.md"
          out="$(bash scripts/docs_validate.sh "$work/docs" || true)"
          case "$out" in *"NOTE [profile]"*endpoints*) ;; *)
            echo "::error::profile note missed a real contract."; exit 1 ;; esac
          # A component's own [kind] tag is stronger evidence than a folder having
          # files, and the folder-only rule stayed silent on a real repo that
          # obviously owned screens — it had a [ui] component right there.
          python3 - "$work" <<'PY2'
          import pathlib, sys
          a = pathlib.Path(sys.argv[1]) / "docs/02_architecture/architecture.md"
          a.write_text(a.read_text().replace(
              "components: []",
              "components:\n  - ui [ui] `docs` — a screen surface\n  - store [db] `docs` — a datastore"))
          PY2
          echo '{"owns":["endpoints"]}' > "$work/.docs-kit.json"
          out="$(bash scripts/docs_validate.sh "$work/docs" || true)"
          case "$out" in *"[ui] component"*) ;; *)
            echo "::error::a [ui] component did not imply owns: screens."; exit 1 ;; esac
          case "$out" in *"[db] component"*) ;; *)
            echo "::error::a [db] component did not imply owns: data."; exit 1 ;; esac
          bash scripts/docs_validate.sh "$work/docs" >/dev/null \
            || { echo "::error::a NOTE changed the exit code; it must not."; exit 1; }
          echo "OK — profile drift noticed, seeds ignored, exit code untouched"

      # Hooks are deterministic and warn-only: they must speak on a real
      # architecture edit and stay silent on anything else.
      - name: Hooks warn on architecture, silent elsewhere
        run: |
          warn=$(echo '{"tool_input":{"file_path":"docs/02_architecture/architecture.md"}}' \
                 | python3 scripts/hook_architecture_warn.py | wc -c)
          logic=$(echo '{"tool_input":{"file_path":"docs/03_business-logic/rules.md"}}' \
                 | python3 scripts/hook_architecture_warn.py | wc -c)
          # 04_api joined layer 1 in 0.20.0; the hook has to guard it like the rest,
          # or the folder the Decision gate exists for is the one nothing watches.
          api=$(echo '{"tool_input":{"file_path":"docs/04_api/orders.md"}}' \
                 | python3 scripts/hook_architecture_warn.py | wc -c)
          [ "$api" -gt 0 ] || { echo "::error::hook stayed silent on an API contract edit."; exit 1; }
          quiet=$(echo '{"tool_input":{"file_path":"src/main.go"}}' \
                  | python3 scripts/hook_architecture_warn.py | wc -c)
          # The plugin ships templates/docs/02_architecture/ — a path that ends in
          # the very thing the hook watches for. Warning there would train this
          # repo's own maintainers to switch the hook off, so it must stay silent.
          tmpl=$(echo '{"tool_input":{"file_path":"templates/docs/02_architecture/architecture.md"}}' \
                  | python3 scripts/hook_architecture_warn.py | wc -c)
          echo "architecture: $warn   business-logic: $logic   unrelated: $quiet   template: $tmpl"
          [ "$warn" -gt 0 ] || { echo "::error::hook stayed silent on an architecture edit."; exit 1; }
          [ "$logic" -gt 0 ] || { echo "::error::hook stayed silent on a business-logic edit."; exit 1; }
          [ "$quiet" -eq 0 ] || { echo "::error::hook fired on an unrelated file."; exit 1; }
          [ "$tmpl" -eq 0 ] || { echo "::error::hook fired on the plugin's own template tree."; exit 1; }
          echo '{"transcript_path":"/nonexistent"}' | python3 scripts/hook_stop_scan.py

      # The crew layer's own discipline applied to itself: every enforcement
      # path is proven red on a known-bad case first, asserting the reason tag
      # — [gate:no-draw], "check 1" — never just the exit code. The suite also
      # runs the CLI end-to-end on a scratch repo (new → done → docs_close via
      # trailer) and the scaffold's add-never-clobber policy.
      - name: Crew layer — gates red for the right reason, CLI end-to-end
        run: bash scripts/crew_test.sh

      # The samples ARE the design contract, and they are real renderer output.
      # Regenerating them must produce no diff — a dirty tree here means either
      # the committed samples are stale or the renderer stopped being
      # deterministic, and both are release blockers.
      - name: Design samples are reproducible
        run: |
          samples="design/sample-index.html design/sample-current.html design/sample-changes.html"
          bash design/make-samples.sh
          if ! git diff --quiet -- $samples; then
            echo "::error::design/sample-*.html differ from a fresh render — run design/make-samples.sh and commit."
            git --no-pager diff --stat -- $samples
            exit 1
          fi
          echo "OK — samples byte-identical to a fresh render"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate plugin (also checks skill frontmatter)
        # --strict turns warnings into errors. An unrecognized or slightly
        # misspelled manifest field still loads at runtime and validates with a
        # warning, which is exactly why it has to fail here: the field you typo
        # is the field you believe you set.
        run: claude plugin validate . --strict
